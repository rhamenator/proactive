name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run allowed install scripts
        run: npm rebuild

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Verify build and tests
        run: npm run verify
        env:
          CI: true

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high --workspace @proactive/backend --workspace @proactive/admin-dashboard --workspace mobile-app

  backend-container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend production image
        run: docker build --file backend/Dockerfile --tag proactive-backend:ci .

      - name: Verify packaged Prisma runtime
        run: |
          docker run --rm \
            --entrypoint node \
            --env DATABASE_URL=postgresql://smoke:smoke@127.0.0.1:1/smoke \
            proactive-backend:ci \
            --input-type=module \
            --eval "const { createPrismaClient } = await import('./backend/dist/src/prisma/prisma-client.factory.js'); const client = createPrismaClient(); await client.\$disconnect();"
